<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMESCENE : PIXEL MYSTERY</title>
    <!-- 도트/픽셀 레트로 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri14&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Galmuri14', 'Pretendard', sans-serif;
        }
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            image-rendering: pixelated;
        }
        .container {
            background-color: #161824;
            padding: 24px;
            border-radius: 4px;
            box-shadow: 0 0 0 4px #2a2e45, 0 8px 0 4px #000;
            max-width: 520px;
            width: 100%;
            border: 4px solid #ff4757;
            position: relative;
        }
        .pixel-header {
            font-family: 'Press Start 2P', monospace;
            color: #ff4757;
            text-align: center;
            font-size: 1.1rem;
            margin-top: 5px;
            margin-bottom: 15px;
            text-shadow: 2px 2px #000;
            letter-spacing: -1px;
            line-height: 1.4;
        }
        .reset-home-btn {
            background-color: #3a3f58;
            color: #fff;
            border: 2px solid #fff;
            padding: 6px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
            margin-bottom: 15px;
            display: inline-block;
        }
        .reset-home-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }
        .story-box {
            background-color: #212538;
            border: 3px solid #3a3f58;
            border-left: 6px solid #ff4757;
            padding: 14px;
            font-size: 0.88rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .story-title {
            font-weight: bold;
            color: #f1e05a;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            color: #a0a7c4;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 3px solid #3a3f58;
            background-color: #0d0e15;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus {
            border-color: #ff4757;
        }
        button {
            width: 100%;
            padding: 12px;
            border: 3px solid #000;
            background-color: #ff4757;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            margin-top: 8px;
            transition: transform 0.05s;
        }
        button:hover {
            background-color: #ff6b81;
        }
        button:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 #000;
        }
        .btn-secondary {
            background-color: #2ed573;
            color: #0d0e15;
        }
        .btn-secondary:hover {
            background-color: #7bed9f;
        }
        .btn-truth {
            background-color: #9b59b6;
            color: #fff;
        }
        .card {
            background: #212538;
            border: 3px dashed #ff4757;
            padding: 20px 16px;
            margin: 16px 0;
            text-align: center;
            cursor: pointer;
            user-select: none;
            min-height: 180px;
        }
        .hidden {
            display: none !important;
        }
        .role-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f1e05a;
            margin-bottom: 8px;
        }
        .is-killer {
            color: #ff4757;
            font-weight: bold;
            background: #3c1e1e;
            padding: 6px 10px;
            border: 2px solid #ff4757;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .is-innocent {
            color: #2ed573;
            font-weight: bold;
            background: #1e3c23;
            padding: 6px 10px;
            border: 2px solid #2ed573;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .info-block {
            text-align: left;
            background: #0d0e15;
            padding: 12px;
            border: 2px solid #3a3f58;
            font-size: 0.83rem;
            line-height: 1.6;
            margin-top: 8px;
        }
        .info-block strong {
            color: #70a1ff;
        }
        .secret-text {
            color: #ff7b72;
            font-weight: bold;
        }
        .clue-box {
            background: #212538;
            border: 3px solid #ff4757;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 0.88rem;
            line-height: 1.6;
            text-align: left;
            box-shadow: 3px 3px 0 #000;
        }
        .clue-box strong {
            color: #f1e05a;
        }
        .truth-box {
            background: #1c1427;
            border: 3px solid #9b59b6;
            padding: 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            line-height: 1.6;
            text-align: left;
            box-shadow: 3px 3px 0 #000;
        }
        .notice {
            font-size: 0.75rem;
            color: #a0a7c4;
            text-align: center;
            margin-top: 6px;
        }
        .round-tag {
            background: #ff4757;
            color: white;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-family: 'Press Start 2P', monospace;
            display: inline-block;
            margin-bottom: 8px;
            box-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 리셋 버튼 및 제목 -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button class="reset-home-btn" onclick="resetToHome()">🏠 처음으로 (초기화)</button>
        <span style="font-size:0.7rem; color:#70a1ff; font-family:'Press Start 2P';">VER 2.0</span>
    </div>
    
    <div class="pixel-header" id="game-main-title">👾 CRIMESCENE 👾</div>

    <!-- 1단계: 설정 화면 -->
    <div id="setup-screen">
        <div class="story-box">
            <div class="story-title">🎲 시나리오 랜덤 생성</div>
            게임을 시작하면 준비된 사건 중 하나가 무작위로 배정됩니다.<br>
            용의자 4명의 이름을 입력하고 시작하세요.
        </div>

        <div class="input-group"><label>용의자 1</label><input type="text" id="p1" value="철수"></div>
        <div class="input-group"><label>용의자 2</label><input type="text" id="p2" value="영희"></div>
        <div class="input-group"><label>용의자 3</label><input type="text" id="p3" value="민수"></div>
        <div class="input-group"><label>용의자 4</label><input type="text" id="p4" value="지민"></div>

        <button onclick="startGame()">▶ 게임 시작 / 사건 생성</button>
    </div>

    <!-- 2단계: 역할 및 개인 정보 확인 -->
    <div id="game-screen" class="hidden">
        <div class="story-box" id="case-overview-box"></div>

        <h3 id="current-player-display" style="text-align:center; color:#70a1ff; margin-bottom:5px;"></h3>
        
        <div class="card" id="role-card" onclick="toggleRole()">
            <div id="card-prompt">
                🔍 <strong>[터치하여 비밀 프로필 확인]</strong>
            </div>
            
            <div id="card-content" class="hidden">
                <div id="char-name" class="role-title"></div>
                <div id="killer-status"></div>
                
                <div class="info-block">
                    <strong>[인물 배경]</strong> <span id="char-bg"></span><br><br>
                    <strong>[사건 당일 상세 동선]</strong><br><span id="char-alibi"></span><br><br>
                    <strong>[나만의 은밀한 비밀]</strong><br><span id="char-secret" class="secret-text"></span>
                </div>
            </div>
        </div>

        <p class="notice">확인 후 다시 터치하여 화면을 숨기고 넘겨주세요.</p>
        <button id="next-btn" onclick="nextPlayer()" class="hidden">확인 완료 (다음 전달)</button>
    </div>

    <!-- 3단계: 라운드별 단서 (1개씩 순차 공개) -->
    <div id="board-screen" class="hidden">
        <div style="text-align:center;">
            <span id="round-indicator" class="round-tag">ROUND 1</span>
        </div>
        <h3 id="round-title" style="text-align:center; margin-top:2px; color:#f1e05a;"></h3>
        
        <div id="clue-container">
            <!-- 단서 1개만 유일하게 삽입됨 -->
        </div>

        <button id="round-btn" onclick="nextRound()" class="btn-secondary">다음 라운드 진행</button>
    </div>
</div>

<script>
    const scenarioDatabase = [
        {
            title: "🩸 리조트 살인사건",
            overview: "VIP 룸에서 회장이 숨진 채 발견되었습니다. 사망 원인은 청산가리 중독. 용의자 4명 중 진범은 단 한 명입니다!",
            characters: [
                { id: "park", roleName: "박파트너 (동업자)", bg: "회장과 10년간 리조트를 공동 운영해 온 사업가.", alibi: "• 21:00~21:30 로비 카페에서 작업.<br>• 21:30~21:45 화장실 다녀옴.<br>• 21:45~22:00 로비 이동.", secret: "회장이 리조트를 해외에 몰래 팔아치우려 한 사실을 알고 폭언을 퍼부었었다." },
                { id: "choi", roleName: "최지배인 (매니저)", bg: "리조트 모든 열쇠를 꿰뚫고 있는 총지배인.", alibi: "• 21:00~21:20 와인 배달.<br>• 21:20~21:40 복도 순찰.<br>• 21:40~22:00 카운터 업무.", secret: "공금 3억 원을 유용했다. 오늘 감사 요구를 받았으며, 청산가리를 보관 중이었다." },
                { id: "lee", roleName: "이주치의 (의사)", bg: "회장의 지병을 전담해 온 개인 의사.", alibi: "• 21:00~21:15 처방약 전달.<br>• 21:15~21:50 방에서 통화.<br>• 21:50~22:00 로비 마주침.", secret: "회장 배우자와 불륜 관계이며, 회장에게 협박당해 불안 상태였다." },
                { id: "kang", roleName: "강배우자 (아내)", bg: "회장과 재혼한 연하의 배우자.", alibi: "• 21:00~21:40 우산 산책.<br>• 21:40~22:00 객실 이동.", secret: "유산 상속 배제 유언장 소식을 알고 오늘 밤 유언장 원본을 훔쳐냈다." }
            ],
            roundClues: [
                "🔍 **1라운드 단서: 와인 잔**<br>회장의 와인 잔 입구에서 청산가리 검출. 와인병 내부는 깨끗함.",
                "🚨 **2라운드 단서: CCTV 기록**<br>21시 30분, 비상계단 문이 지배인 키카드로 열린 기록 포착.",
                "🔥 **3라운드 단서: 찢어진 서류**<br>쓰레기통에서 '지분 인수 계약 파기 - 박...' 서류 조각 발견."
            ],
            truths: {
                choi: "<strong>[진범: 최지배인]</strong><br>공금 유용 발각 위기 시 와인 배달 때 잔에 청산가리를 바르고, 21시 30분 키카드로 비상계단을 통해 들어가 사망을 확인했습니다.",
                lee: "<strong>[진범: 이주치의]</strong><br>불륜 협박에 약 전달 때 캡슐을 청산가리로 교체했습니다. 회장이 약을 마시다 사망했습니다.",
                kang: "<strong>[진범: 강배우자]</strong><br>유산 박탈 소식에 21시 20분 와인 잔에 독을 타고 유언장을 훔쳤습니다.",
                park: "<strong>[진범: 박파트너]</strong><br>지분 배신에 분노하여 VIP 룸에 침입해 서류를 찢고 와인 잔에 독을 탔습니다."
            }
        },
        {
            title: "❄️ 설산 산장 살인사건",
            overview: "폭설로 고립된 산장, 주인 '성장원'이 난로 옆에서 흉기에 맞아 숨진 채 발견되었습니다.",
            characters: [
                { id: "kim", roleName: "김산악 (구조대원)", bg: "산장 지형을 잘 아는 오랜 베테랑 구조대원.", alibi: "• 22:00~22:30 제설 장비 점검.<br>• 22:30~23:00 2층 휴게실 차 마심.", secret: "과거 성주인의 과실로 동료가 죽은 사실을 얼마 전 알게 되었다." },
                { id: "lee_doc", roleName: "이약사 (손님)", bg: "산장에 휴가를 온 정체불명의 손님.", alibi: "• 22:00~22:40 독서.<br>• 22:40~23:00 화장실 다녀옴.", secret: "성주인에게 사채 빚을 지고 장기 매매 협박을 받고 있었다." },
                { id: "park_sub", roleName: "박알바 (스태프)", bg: "산장 청소와 요리를 담당하는 알바생.", alibi: "• 22:00~22:20 주방 정리.<br>• 22:20~22:50 와인 창고 재고 조사.", secret: "비밀 장부를 도둑질하다 걸려 오늘 강제 퇴출 통보를 받았다." },
                { id: "choi_pro", roleName: "최프로 (선수)", bg: "성주인의 후원을 받는 유명 스키 선수.", alibi: "• 22:00~22:40 재활 운동.<br>• 22:40~23:00 거실 난로 확인.", secret: "도핑 테스트 적발 폭로 협박을 성주인에게 받고 있었다." }
            ],
            roundClues: [
                "🔍 **1라운드 단서: 피묻은 등산 스틱**<br>난로 뒤편에서 피해자의 혈흔이 묻은 스틱 발견.",
                "🚨 **2라운드 단서: 수면제 빈 병**<br>화장실 쓰레기통에서 강력 수면제 빈 병 발견.",
                "🔥 **3라운드 단서: 타다 남은 차용증**<br>난로 내부에서 성주인의 이름이 적힌 차용증 조각 발견."
            ],
            truths: {
                kim: "<strong>[진범: 김산악]</strong><br>동료의 복수를 위해 22시 20분 등산 스틱으로 성주인을 가격했습니다.",
                lee_doc: "<strong>[진범: 이약사]</strong><br>차에 수면제를 타서 잠들게 한 뒤 난로 옆 흉기로 살해했습니다.",
                park_sub: "<strong>[진범: 박알바]</strong><br>강제 퇴출에 분노해 와인 창고 둔기로 살해하고 장부를 태웠습니다.",
                choi_pro: "<strong>[진범: 최프로]</strong><br>폭로를 막기 위해 난로 앞에서 격투 끝에 스틱으로 범행했습니다."
            }
        }
    ];

    let currentScenario = null;
    let players = [];
    let assignedRoles = [];
    let currentIndex = 0;
    let isRevealed = false;
    let currentRound = 1;
    let killerPlayerName = "";
    let killerCharInfo = null;

    function startGame() {
        const p1 = document.getElementById('p1').value.trim();
        const p2 = document.getElementById('p2').value.trim();
        const p3 = document.getElementById('p3').value.trim();
        const p4 = document.getElementById('p4').value.trim();

        if (!p1 || !p2 || !p3 || !p4) {
            alert('4명의 용의자 이름을 모두 입력하세요.');
            return;
        }

        players = [p1, p2, p3, p4];

        // 랜덤 시나리오 선택
        const randIdx = Math.floor(Math.random() * scenarioDatabase.length);
        currentScenario = scenarioDatabase[randIdx];

        document.getElementById('game-main-title').innerText = currentScenario.title;
        document.getElementById('case-overview-box').innerHTML = `
            <div class="story-title">📌 사건 개요</div>
            ${currentScenario.overview}
        `;

        const killerIndex = Math.floor(Math.random() * 4);
        assignedRoles = currentScenario.characters.map((char, index) => ({
            ...char,
            isKiller: index === killerIndex
        }));

        assignedRoles.sort(() => Math.random() - 0.5);

        const killerObj = assignedRoles.find(r => r.isKiller);
        const killerIdx = assignedRoles.indexOf(killerObj);
        killerPlayerName = players[killerIdx];
        killerCharInfo = killerObj;

        currentIndex = 0;
        currentRound = 1;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        updateTurn();
    }

    function updateTurn() {
        isRevealed = false;
        document.getElementById('current-player-display').innerText = `👤 ${players[currentIndex]} 님의 차례`;
        document.getElementById('card-prompt').classList.remove('hidden');
        document.getElementById('card-content').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
    }

    function toggleRole() {
        const cardPrompt = document.getElementById('card-prompt');
        const cardContent = document.getElementById('card-content');
        const nextBtn = document.getElementById('next-btn');

        if (!isRevealed) {
            const role = assignedRoles[currentIndex];
            document.getElementById('char-name').innerText = role.roleName;
            
            const killerStatus = document.getElementById('killer-status');
            if (role.isKiller) {
                killerStatus.innerHTML = '<div class="is-killer">🚨 당신은 진범입니다!</div><br><small style="color:#ff7b72;">알리바이를 조화롭게 섞어 혐의를 벗어나세요.</small>';
            } else {
                killerStatus.innerHTML = '<div class="is-innocent">🟢 무고한 용의자입니다.</div><br><small style="color:#2ed573;">알리바이 모순을 찾아 진범을 밝혀내세요.</small>';
            }

            document.getElementById('char-bg').innerText = role.bg;
            document.getElementById('char-alibi').innerHTML = role.alibi;
            document.getElementById('char-secret').innerText = role.secret;

            cardPrompt.classList.add('hidden');
            cardContent.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            isRevealed = true;
        } else {
            cardPrompt.classList.remove('hidden');
            cardContent.classList.add('hidden');
            isRevealed = false;
        }
    }

    function nextPlayer() {
        currentIndex++;
        if (currentIndex < players.length) {
            updateTurn();
        } else {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('board-screen').classList.remove('hidden');
            renderRound();
        }
    }

    function renderRound() {
        const container = document.getElementById('clue-container');
        const roundTag = document.getElementById('round-indicator');
        const roundTitle = document.getElementById('round-title');
        const roundBtn = document.getElementById('round-btn');

        if (currentRound <= 3) {
            roundTag.innerText = `ROUND ${currentRound}`;
            roundTitle.innerText = `${currentRound}라운드 단서 공개`;
            
            // 라운드당 딱 1개의 단서만 출력
            const clueText = currentScenario.roundClues[currentRound - 1];
            container.innerHTML = `<div class="clue-box">${clueText}</div>`;
            
            if (currentRound < 3) {
                roundBtn.innerText = `다음 단서 공개 (${currentRound + 1}라운드)`;
                roundBtn.className = "btn-secondary";
            } else {
                roundBtn.innerText = "최종 범인 투표 단계로 이동";
                roundBtn.className = "";
            }
        } else if (currentRound === 4) {
            roundTag.innerText = "VOTE";
            roundTitle.innerText = "최종 범인 지목 투표";
            container.innerHTML = `
                <div class="story-box" style="border-left-color:#f1e05a; text-align:center;">
                    <div class="story-title">⚖️ 지목 및 투표</div>
                    단서 3개가 모두 공개되었습니다.<br>
                    토론 후 **동시에 범인을 지목**하세요!
                </div>
            `;
            roundBtn.innerText = "🔓 사건 진상 및 범인 해설 공개";
            roundBtn.className = "btn-truth";
        } else if (currentRound === 5) {
            roundTag.innerText = "TRUTH";
            roundTag.style.backgroundColor = "#9b59b6";
            roundTitle.innerText = "🎭 사건의 진실";

            const truthStory = currentScenario.truths[killerCharInfo.id];

            container.innerHTML = `
                <div class="truth-box">
                    <h3 style="color:#ff4757; margin-top:0; text-align:center;">
                        🩸 진범: ${killerPlayerName} (${killerCharInfo.roleName})
                    </h3>
                    <hr style="border-color:#3a3f58; margin: 10px 0;">
                    ${truthStory}
                </div>
            `;
            roundBtn.innerText = "🔄 다음 사건 시작하기 (랜덤)";
            roundBtn.className = "";
        }
    }

    function nextRound() {
        if (currentRound < 5) {
            currentRound++;
            renderRound();
        } else {
            resetToHome();
        }
    }

    // 언제든 첫 화면(초기화)으로 돌아가는 기능
    function resetToHome() {
        currentRound = 1;
        document.getElementById('board-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        document.getElementById('game-main-title').innerText = "👾 CRIMESCENE 👾";
    }
</script>

</body>
</html>
