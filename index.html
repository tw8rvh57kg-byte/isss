                choi_pro: "<strong>[범행 전말]</strong> 최프로가 밀쳤을 때 난로 모서리에 머리가 깊게 박혀 즉사했습니다."

    // 게임 상태 변수
    let currentScenario = null;
    let players = [];
    let assignedRoles = [];
    let currentIndex = 0;
    let isRevealed = false;
    let currentRound = 1;
    let killerPlayerName = "";
    let killerCharInfo = null;

    // 1단계 -> 2단계: 전체 브리핑 이동
    function startOverviewStage() {
        const p1 = document.getElementById('p1').value.trim();
        const p2 = document.getElementById('p2').value.trim();
        const p3 = document.getElementById('p3').value.trim();
        const p4 = document.getElementById('p4').value.trim();

        if (!p1 || !p2 || !p3 || !p4) {
            alert('4명의 용의자 이름을 모두 입력하세요.');
            return;
        }

        players = [p1, p2, p3, p4];

        // 랜덤 시나리오 선택
        const randIdx = Math.floor(Math.random() * scenarioDatabase.length);
        currentScenario = scenarioDatabase[randIdx];

        document.getElementById('game-main-title').innerText = currentScenario.title;
        document.getElementById('overview-detail-box').innerHTML = `
            <div class="story-title">📌 사건 전체 개요</div>
            ${currentScenario.overview}
        `;

        // 범인 및 역할 무작위 지정
        const killerIndex = Math.floor(Math.random() * 4);
        assignedRoles = currentScenario.characters.map((char, index) => ({
            ...char,
            isKiller: index === killerIndex
        }));

        // 역할 섞기
        assignedRoles.sort(() => Math.random() - 0.5);

        const killerObj = assignedRoles.find(r => r.isKiller);
        const killerIdx = assignedRoles.indexOf(killerObj);
        killerPlayerName = players[killerIdx];
        killerCharInfo = killerObj;

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('overview-screen').classList.remove('hidden');
        document.getElementById('global-back-btn').style.display = 'inline-block';
    }

    // 2단계 -> 3단계: 개별 역할 확인 시작
    function startRoleAssignmentStage() {
        currentIndex = 0;
        document.getElementById('overview-screen').classList.add('hidden');
        document.getElementById('role-screen').classList.remove('hidden');
        updateTurn();
    }

    function updateTurn() {
        isRevealed = false;
        document.getElementById('current-player-display').innerText = `👤 ${players[currentIndex]} 님의 차례 (${currentIndex + 1}/4)`;
        document.getElementById('card-prompt').classList.remove('hidden');
        document.getElementById('card-content').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');

        const prevBtn = document.getElementById('prev-player-btn');
        if (currentIndex === 0) {
            prevBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'block';
        }
    }

    function toggleRole() {
        const cardPrompt = document.getElementById('card-prompt');
        const cardContent = document.getElementById('card-content');
        const nextBtn = document.getElementById('next-btn');
        const killerMethodBox = document.getElementById('killer-method-box');

        if (!isRevealed) {
            const role = assignedRoles[currentIndex];
            document.getElementById('char-name').innerText = role.roleName;
            
            const killerStatus = document.getElementById('killer-status');
            if (role.isKiller) {
                killerStatus.innerHTML = '<div class="is-killer">🚨 당신은 범인입니다!</div><br><small style="color:#ff7b72;">다른 용의자들의 비밀과 오해를 이용해 범행을 숨기세요.</small>';
                document.getElementById('killer-method-text').innerHTML = role.method;
                killerMethodBox.classList.remove('hidden');
            } else {
                killerStatus.innerHTML = '<div class="is-innocent">🟢 무고한 용의자입니다.</div><br><small style="color:#2ed573;">자신의 비밀이 오해받지 않도록 진범을 찾아내세요.</small>';
                killerMethodBox.classList.add('hidden');
            }

            document.getElementById('char-bg').innerText = role.bg;
            document.getElementById('char-alibi').innerHTML = role.alibi;
            document.getElementById('char-secret').innerText = role.secret;

            cardPrompt.classList.add('hidden');
            cardContent.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            isRevealed = true;
        } else {
            cardPrompt.classList.remove('hidden');
            cardContent.classList.add('hidden');
            isRevealed = false;
        }
    }

    function nextPlayer() {
        currentIndex++;
        if (currentIndex < players.length) {
            updateTurn();
        } else {
            document.getElementById('role-screen').classList.add('hidden');
            document.getElementById('board-screen').classList.remove('hidden');
            currentRound = 1;
            renderRound();
        }
    }

    function prevPlayer() {
        if (currentIndex > 0) {
            currentIndex--;
            updateTurn();
        }
    }

    function renderRound() {
        const container = document.getElementById('clue-container');
        const roundTag = document.getElementById('round-indicator');
        const roundTitle = document.getElementById('round-title');
        const roundBtn = document.getElementById('round-btn');
        const roundBackBtn = document.getElementById('round-back-btn');

        if (currentRound === 1) {
            roundBackBtn.style.display = 'none';
        } else {
            roundBackBtn.style.display = 'block';
        }

        if (currentRound <= 3) {
            roundTag.innerText = `ROUND ${currentRound}`;
            roundTitle.innerText = `${currentRound}라운드 단서 공개`;
            
            const clueText = currentScenario.roundClues[currentRound - 1];
            container.innerHTML = `<div class="clue-box">${clueText}</div>`;
            
            if (currentRound < 3) {
                roundBtn.innerText = `다음 단서 (${currentRound + 1}R) ▶`;
                roundBtn.className = "btn-secondary";
            } else {
                roundBtn.innerText = "범인 투표 단계로 ▶";
                roundBtn.className = "";
            }
        } else if (currentRound === 4) {
            roundTag.innerText = "VOTE";
            roundTitle.innerText = "최종 범인 지목 투표";
            container.innerHTML = `
                <div class="story-box" style="border-left-color:#f1e05a; text-align:center;">
                    <div class="story-title">⚖️ 지목 및 투표</div>
                    모든 단서가 공개되었습니다.<br>
                    충분한 토론 후 **하나, 둘, 셋에 맞춰 범인을 동시 지목**하세요!
                </div>
            `;
            roundBtn.innerText = "🔓 사건 진상 및 해설 공개 ▶";
            roundBtn.className = "btn-truth";
        } else if (currentRound === 5) {
            roundTag.innerText = "TRUTH";
            roundTag.style.backgroundColor = "#9b59b6";
            roundTitle.innerText = "🎭 사건의 진실";

            const truthStory = currentScenario.truths[killerCharInfo.id];

            container.innerHTML = `
                <div class="truth-box">
                    <h3 style="color:#ff4757; margin-top:0; text-align:center;">
                        🩸 범인: ${killerPlayerName} (${killerCharInfo.roleName})
                    </h3>
                    <hr style="border-color:#3a3f58; margin: 10px 0;">
                    ${truthStory}
                </div>
            `;
            roundBtn.innerText = "🔄 다음 사건 시작 (랜덤)";
            roundBtn.className = "";
        }
    }

    function nextRound() {
        if (currentRound < 5) {
            currentRound++;
            renderRound();
        } else {
            resetToHome();
        }
    }

    function prevRound() {
        if (currentRound > 1) {
            currentRound--;
            renderRound();
        }
    }

    // 상단 [이전으로] 버튼 클릭 동작
    function handleGlobalBack() {
        const isOverviewScreen = !document.getElementById('overview-screen').classList.contains('hidden');
        const isRoleScreen = !document.getElementById('role-screen').classList.contains('hidden');
        const isBoardScreen = !document.getElementById('board-screen').classList.contains('hidden');

        if (isBoardScreen) {
            if (currentRound > 1) {
                prevRound();
            } else {
                document.getElementById('board-screen').classList.add('hidden');
                document.getElementById('role-screen').classList.remove('hidden');
                currentIndex = players.length - 1;
                updateTurn();
            }
        } else if (isRoleScreen) {
            if (currentIndex > 0) {
                prevPlayer();
            } else {
                document.getElementById('role-screen').classList.add('hidden');
                document.getElementById('overview-screen').classList.remove('hidden');
            }
        } else if (isOverviewScreen) {
            resetToHome();
        }
    }

    // 초기화 및 첫 화면으로
    function resetToHome() {
        currentRound = 1;
        document.getElementById('board-screen').classList.add('hidden');
        document.getElementById('role-screen').classList.add('hidden');
        document.getElementById('overview-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        document.getElementById('global-back-btn').style.display = 'none';
        document.getElementById('game-main-title').innerText = "👾 CRIMESCENE 👾";
    }
</script>
